validation:
  baseline_parity_required: true
  selection: chronological_rolling_origin_then_prospective_paper
  paired_block_bootstrap:
    repetitions: 2000
    seed: 20260926
    minimum_block: calendar_week
  report_quantiles: [0.05, 0.50, 0.95]
